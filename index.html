<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative&family=Great+Vibes&family=Josefin+Sans&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f7f7f7;
            font-family: 'Josefin Sans', sans-serif;
            overflow: hidden;
        }
        h1 {
            color: #d25d92;
            text-align: center;
            animation: roseGlow 1.5s infinite;
        }
        @keyframes riseIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes riseStay {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        @keyframes goldPulse {
            0%, 100% { text-shadow: 0 0 5px #ffeb3b; }
            50% { text-shadow: 0 0 15px #ffeb3b; }
        }
        @keyframes roseGlow {
            0% { text-shadow: 0 0 15px #ff69b4; }
            50% { text-shadow: 0 0 25px #ff69b4; }
            100% { text-shadow: 0 0 15px #ff69b4; }
        }
        @keyframes stickerPop {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
    <title>Georgia Birthday Celebration</title>
</head>
<body>
    <h1>Happy Birthday Georgia!</h1>
    <canvas id="canvas" width="800" height="600"></canvas>
    <script>
        // Canvas rendering and particle effects
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        class Particle {
            constructor(x, y, speedX, speedY) {
                this.x = x;
                this.y = y;
                this.speedX = speedX;
                this.speedY = speedY;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
            }
            draw() {
                ctx.fillStyle = 'rgba(255, 0, 255, 0.5)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function spawnParticle() {
            const x = canvas.width * Math.random();
            const y = canvas.height * Math.random();
            const speedX = (Math.random() - 0.5) * 2;
            const speedY = (Math.random() - 0.5) * 2;
            particles.push(new Particle(x, y, speedX, speedY));
        }

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((particle, index) => {
                particle.update();
                particle.draw();
                if (particle.x < 0 || particle.x > canvas.width || particle.y < 0 || particle.y > canvas.height) {
                    particles.splice(index, 1);
                }
            });
        }

        function animate() {
            spawnParticle();
            update();
            requestAnimationFrame(animate);
        }

        canvas.addEventListener('click', (event) => {
            const x = event.clientX;
            const y = event.clientY;
            particles.push(new Particle(x, y, Math.random() * 4 - 2, Math.random() * -4));
        });

        animate();
    </script>
</body>
</html>
